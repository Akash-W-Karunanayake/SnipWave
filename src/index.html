<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipWave — Audio Multi-Cutter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Upload Screen -->
  <div id="upload-screen" class="screen active">
    <div class="upload-container">
      <div class="app-logo-large">
        <div class="logo-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6c5ce7"/>
                <stop offset="100%" stop-color="#00b894"/>
              </linearGradient>
            </defs>
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <h1>SnipWave</h1>
        <span class="tagline">Split. Snip. Zip.</span>
      </div>
      <div id="drop-zone" class="drop-zone">
        <div class="drop-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <h2>Drop your audio file here</h2>
        <p>or click to browse</p>
        <p class="supported-formats">MP3, WAV, OGG, FLAC, M4A, AAC</p>
      </div>
    </div>
  </div>

  <!-- Editor Screen -->
  <div id="editor-screen" class="screen">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="toolbar-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="url(#logoGradSmall)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="logoGradSmall" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6c5ce7"/>
                <stop offset="100%" stop-color="#00b894"/>
              </linearGradient>
            </defs>
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <span class="app-brand">SnipWave</span>
        </div>
        <span class="toolbar-divider"></span>
        <button id="btn-new-file" class="btn btn-ghost" title="Load new file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          <span>New File</span>
        </button>
        <span id="file-name" class="file-name"></span>
      </div>
    </header>

    <main class="editor-main">
      <!-- Waveform -->
      <div class="waveform-container">
        <canvas id="waveform-canvas"></canvas>
        <div id="cut-markers-overlay" class="cut-markers-overlay"></div>
        <div id="playhead" class="playhead"></div>
      </div>

      <!-- Time Display -->
      <div class="time-display">
        <span id="current-time">0.0s</span>
        <span class="time-separator">/</span>
        <span id="total-time">0.0s</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="transport-controls">
          <button id="btn-back" class="btn btn-control" title="Back 0.1s">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20"/>
              <line x1="5" y1="19" x2="5" y2="5"/>
            </svg>
          </button>
          <button id="btn-play" class="btn btn-play" title="Play / Pause">
            <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>
          <button id="btn-stop" class="btn btn-control" title="Stop">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
            </svg>
          </button>
          <button id="btn-forward" class="btn btn-control" title="Forward 0.1s">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"/>
              <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
          </button>
        </div>

        <div class="action-controls">
          <button id="btn-mark-cut" class="btn btn-accent" title="Mark cut at current position (M)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"/>
              <circle cx="6" cy="18" r="3"/>
              <line x1="20" y1="4" x2="8.12" y2="15.88"/>
              <line x1="14.47" y1="14.48" x2="20" y2="20"/>
              <line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
            <span>Mark Cut</span>
          </button>
          <button id="btn-split" class="btn btn-primary" disabled title="Split audio at marked positions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="16" y1="3" x2="16" y2="21"/>
              <line x1="8" y1="3" x2="8" y2="21"/>
              <line x1="3" y1="12" x2="8" y2="12"/>
              <line x1="16" y1="12" x2="21" y2="12"/>
            </svg>
            <span>Split</span>
          </button>
        </div>
      </div>

      <!-- Cut Points List -->
      <div id="cut-points-section" class="cut-points-section" style="display:none">
        <h3>Cut Points</h3>
        <div id="cut-points-list" class="cut-points-list"></div>
      </div>

      <!-- Segments Panel (shown after split) -->
      <div id="segments-section" class="segments-section" style="display:none">
        <div class="segments-header">
          <h3>Segments</h3>
          <div class="segments-actions">
            <button id="btn-reset-split" class="btn btn-ghost-danger" title="Go back to editing cut points">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
              <span>Reset</span>
            </button>
            <button id="btn-download-zip" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>Download Zip</span>
            </button>
          </div>
        </div>
        <div id="segments-list" class="segments-list"></div>
      </div>
    </main>

    <!-- Processing overlay -->
    <div id="processing-overlay" class="processing-overlay" style="display:none">
      <div class="processing-content">
        <div class="spinner"></div>
        <p id="processing-text">Processing...</p>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
